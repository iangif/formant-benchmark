# Praat Burg on MCQLL GlobalPhone French (gp_fra) vowel tokens.
#
# Assumptions and caveats:
# - Gold tracks are hand-corrected FastTrack candidates, which gives FastTrackPy a
#     home advantage. Keep this in mind when comparing it with other trackers.
# - Gold is the exporter's raw F1-F4, not the smoothed F1_s-F4_s columns.
# - Each item is a short clip around one vowel token; only the vowel interval is
#     evaluated.
# - Batches are not splits: every batch copied into data/raw is used.
# - Formant ceilings are set per speaker group (see overrides); other parameters
#     are Praat defaults from configs/trackers/praat_burg.yaml.
# - Evaluation scores every formant present in both gold and predictions, so F4 is
#     included where possible. For a like-for-like comparison across trackers,
#     restrict the analysis to F1-F3.
# - The whole vowel is scored (no central_region).

dataset: mcqll_french
tracker: praat_burg

tracking:
  input_mode: full_item           # each item is one vowel token
  # All speakers are adults.
  overrides:
    - where:
        gender: male
      parameters:
        maximum_formant: 5000.0
    - where:
        gender: female
      parameters:
        maximum_formant: 5500.0

evaluation:
  scope: vowels
