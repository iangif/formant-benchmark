# Praat Burg on VTR Formants (TIMIT utterances), test split.
#
# Notes:
# - Only the test split is used, so no tracker is scored on data it may have been
#     trained on. The FormantsTracker checkpoint is believed not to be trained on
#     VTR, but this is unconfirmed.
# - Each vowel is tracked as its own crop with 25 ms of context on each side: the
#     half-window Praat and FastTrackPy need to analyse the vowel's edges. More
#     context degrades FastTrackPy, which fits its ceiling and smoothing to all the
#     audio it is given.

dataset: vtr
tracker: praat_burg

tracking:
  input_mode: cropped_intervals
  interval_type: vowel
  interval_padding_s: 0.025
  split: test
  # All speakers are adults.
  overrides:
    - where:
        gender: male
      parameters:
        maximum_formant: 5000.0
    - where:
        gender: female
      parameters:
        maximum_formant: 5500.0

evaluation:
  scope: vowels
