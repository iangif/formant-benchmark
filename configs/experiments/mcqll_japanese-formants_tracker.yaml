# FormantsTracker on MCQLL GlobalPhone Japanese (gp_jpn) vowel tokens.
#
# Notes:
# - Gold tracks are hand-corrected FastTrack candidates, which may favour FastTrackPy.
# - Speakers are mostly male (769 male, 147 female items).
# - Unlike the other trackers, FormantsTracker is given the whole clip around the
#     vowel (about 1 s), not a vowel crop. It is a CNN trained on whole utterances,
#     and on short vowel crops a few percent of vowels fail outright (all formants far
#     above gold).

dataset: mcqll_japanese
tracker: formants_tracker

tracking:
  input_mode: full_item

evaluation:
  scope: vowels
