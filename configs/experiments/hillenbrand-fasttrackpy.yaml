# FastTrackPy on Hillenbrand et al. (1995) hVd words.
#
# Notes:
# - Gold is static: steady state and 10%-80% points, at which predictions are sampled.
# - Each vowel is tracked as its own crop with 25 ms of context on each side: the
#     half-window Praat and FastTrackPy need to analyse the vowel's edges. More
#     context degrades FastTrackPy, which fits its ceiling and smoothing to all the
#     audio it is given.
# - FastTrackPy chooses its formant ceiling itself, between 4000 and 7000 Hz.

dataset: hillenbrand
tracker: fasttrackpy

tracking:
  input_mode: cropped_intervals
  interval_type: vowel
  interval_padding_s: 0.025

evaluation:
  scope: vowels
