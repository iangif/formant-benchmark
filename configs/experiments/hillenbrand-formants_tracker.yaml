# FormantsTracker on Hillenbrand et al. (1995) hVd words.
#
# Notes:
# - Gold is static: steady state and 10%-80% points, at which predictions are sampled.
# - Unlike the other trackers, FormantsTracker is given the whole hVd recording, not
#     a vowel crop. It is a CNN trained on whole utterances, and on short vowel crops
#     a few percent of vowels fail outright (all formants far above gold).

dataset: hillenbrand
tracker: formants_tracker

tracking:
  input_mode: full_item

evaluation:
  scope: vowels
