# Praat Burg on MCQLL CSLT Uyghur (cslt_uig) vowel tokens.
#
# Notes:
# - Gold tracks are hand-corrected FastTrack candidates, which may favour FastTrackPy.
# - Each vowel is tracked as its own crop with 25 ms of context on each side: the
#     half-window Praat and FastTrackPy need to analyse the vowel's edges. More
#     context degrades FastTrackPy, which fits its ceiling and smoothing to all the
#     audio it is given.

dataset: mcqll_uyghur
tracker: praat_burg

tracking:
  input_mode: cropped_intervals
  interval_type: vowel
  interval_padding_s: 0.025
  # All speakers are adults.
  overrides:
    - where:
        gender: male
      parameters:
        maximum_formant: 5000.0
    - where:
        gender: female
      parameters:
        maximum_formant: 5500.0

evaluation:
  scope: vowels
