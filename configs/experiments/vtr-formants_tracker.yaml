# FormantsTracker on VTR Formants (TIMIT utterances), test split.
#
# Notes:
# - Only the test split is used, so no tracker is scored on data it may have been
#     trained on. The FormantsTracker checkpoint is believed not to be trained on
#     VTR, but this is unconfirmed.
# - Unlike the other trackers, FormantsTracker is given the whole utterance, not a
#     vowel crop. It is a CNN trained on whole utterances, and on short vowel crops a
#     few percent of vowels fail outright (all formants far above gold).

dataset: vtr
tracker: formants_tracker

tracking:
  input_mode: full_item
  split: test

evaluation:
  scope: vowels
