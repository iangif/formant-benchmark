# Praat Burg on MCQLL English vowel tokens, with speaker-dependent formant ceilings.
dataset: mcqll_english
tracker: praat_burg

tracking:
  input_mode: full_item           # each MCQLL item is one vowel token
  overrides:
    - where:
        gender: male
      parameters:
        maximum_formant: 5500.0
    - where:
        gender: female
      parameters:
        maximum_formant: 6500.0

evaluation:
  scope: vowels
  formants: [F1, F2, F3]          # same formants as FormantsTracker for a fair comparison
