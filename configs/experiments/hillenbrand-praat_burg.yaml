# Praat Burg on Hillenbrand et al. (1995) hVd words.
#
# Assumptions and caveats:
# - Gold is static (steady state and 10%-80% points), not continuous tracks;
#     predictions are sampled at those points.
# - Gold has F1-F3 only, so F4 is never evaluated on this dataset.
# - No splits: every item is used.
# - Formant ceilings are set per speaker group (see overrides); other parameters
#     are Praat defaults from configs/trackers/praat_burg.yaml.
# - Evaluation scores every formant present in both gold and predictions, so F4 is
#     included where possible. For a like-for-like comparison across trackers,
#     restrict the analysis to F1-F3.
# - The whole vowel is scored (no central_region).

dataset: hillenbrand
tracker: praat_burg

tracking:
  input_mode: full_item           # each item is one hVd word recording
  # Children (10-12 years) are labelled gender male/female, so ceilings are set
  # by speaker_group (man, woman, boy, girl) instead of gender.
  overrides:
    - where:
        speaker_group: man
      parameters:
        maximum_formant: 5000.0
    - where:
        speaker_group: woman
      parameters:
        maximum_formant: 5500.0
    - where:
        speaker_group: boy
      parameters:
        maximum_formant: 6500.0
    - where:
        speaker_group: girl
      parameters:
        maximum_formant: 6500.0

evaluation:
  scope: vowels
