# Praat Burg on Hillenbrand et al. (1995) hVd words.
#
# Notes:
# - Gold is static: steady state and 10%-80% points, at which predictions are sampled.
# - Each vowel is tracked as its own crop with 25 ms of context on each side: the
#     half-window Praat and FastTrackPy need to analyse the vowel's edges. More
#     context degrades FastTrackPy, which fits its ceiling and smoothing to all the
#     audio it is given.

dataset: hillenbrand
tracker: praat_burg

tracking:
  input_mode: cropped_intervals
  interval_type: vowel
  interval_padding_s: 0.025
  # Children (10-12 years) are labelled gender male/female, so ceilings are set
  # by speaker_group (man, woman, boy, girl) instead of gender.
  overrides:
    - where:
        speaker_group: man
      parameters:
        maximum_formant: 5000.0
    - where:
        speaker_group: woman
      parameters:
        maximum_formant: 5500.0
    - where:
        speaker_group: boy
      parameters:
        maximum_formant: 6500.0
    - where:
        speaker_group: girl
      parameters:
        maximum_formant: 6500.0

evaluation:
  scope: vowels
